# Host-buildable crates. Firmware lives in firmware/*, each its own workspace
# (different targets and toolchains), and depends on these by path.
[workspace]
resolver = "2"
members = [
    "crates/rid", "crates/link", "crates/tracker", "crates/odid-ref",
    "crates/gnss", "crates/screen", "crates/webui",
    "crates/droneid", "crates/openlink", "crates/adsb", "crates/rawcap", "crates/airlink",
    "crates/coverage", "crates/nodeimage", "crates/fpvscan", "crates/djilink",
    "crates/wifidrone", "crates/wifiwatch", "crates/jamwatch",
    "crates/sdnative", "crates/wirebus",
    "crates/airspace", "crates/faarules", "crates/modes",
    "crates/evidence", "crates/djicrypt", "crates/uat", "crates/flarm",
    "crates/aerohop", "crates/lr2021cfg", "crates/ctrlwatch", "crates/mavwatch",
    "crates/kitkeys", "crates/hublink", "crates/fuzzkit",
    "tools/rid-view", "tools/rid-ble-beacon", "tools/droneid-file", "tools/rfuav-check", "tools/rawcap-pull", "tools/droneid-hil",
    "tools/cc26xx-flash", "tools/airspace-pack", "tools/modes-live",
    "tools/evidence-verify", "tools/evidence-server",
    "tools/link-key", "tools/flarm-keys", "tools/fontgen",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/holdTheDoorHoid/rotorscope"

[workspace.dependencies]
rid = { path = "crates/rid" }
link = { path = "crates/link" }
wirebus = { path = "crates/wirebus" }
tracker = { path = "crates/tracker" }
openlink = { path = "crates/openlink" }
adsb = { path = "crates/adsb" }
airspace = { path = "crates/airspace" }
faarules = { path = "crates/faarules" }
evidence = { path = "crates/evidence" }
djicrypt = { path = "crates/djicrypt" }
mavwatch = { path = "crates/mavwatch" }
modes = { path = "crates/modes" }
wifidrone = { path = "crates/wifidrone" }
droneid = { path = "crates/droneid", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
heapless = { version = "0.9.4", features = ["serde"] }
postcard = { version = "1", default-features = false, features = ["heapless"] }

# The jamming tests push millions of synthetic samples through the DSP
# crates; unoptimised they take minutes.
[profile.dev.package.jamwatch]
opt-level = 2
[profile.dev.package.fpvscan]
opt-level = 2
[profile.dev.package.rawcap]
opt-level = 2
# The wire simulation steps every quarter byte through seconds of traffic.
[profile.dev.package.wirebus]
opt-level = 2
# The ELRS UID-recovery test rebuilds 65,536 candidate hop tables.
[profile.dev.package.ctrlwatch]
opt-level = 2
