# Host-buildable crates. Firmware lives in firmware/*, each its own workspace
# (different targets and toolchains), and depends on these by path.
[workspace]
resolver = "2"
members = [
    "crates/rid", "crates/link", "crates/tracker", "crates/odid-ref",
    "crates/gnss", "crates/screen", "crates/webui",
    "crates/droneid", "crates/openlink", "crates/adsb", "crates/rawcap", "crates/airlink",
    "crates/coverage", "crates/nodeimage", "crates/fpvscan",
    "crates/wifidrone",
    "crates/sdnative",
    "crates/airspace", "crates/faarules",
    "tools/rid-view", "tools/rid-ble-beacon", "tools/droneid-file", "tools/rawcap-pull", "tools/droneid-hil",
    "tools/cc26xx-flash", "tools/airspace-pack",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/holdTheDoorHoid/rotorscope"

[workspace.dependencies]
rid = { path = "crates/rid" }
link = { path = "crates/link" }
tracker = { path = "crates/tracker" }
openlink = { path = "crates/openlink" }
adsb = { path = "crates/adsb" }
airspace = { path = "crates/airspace" }
faarules = { path = "crates/faarules" }
wifidrone = { path = "crates/wifidrone" }
droneid = { path = "crates/droneid", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
heapless = { version = "0.8", features = ["serde"] }
postcard = { version = "1", default-features = false, features = ["heapless"] }
