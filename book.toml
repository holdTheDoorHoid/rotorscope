# The Rotorscope documentation site (mdBook). The pages live in docs/ and are
# plain Markdown, so they also read well on GitHub. Build it with
# tools/docs-build.sh; see docs/dev/docs-style.md.

[book]
title = "Rotorscope"
description = "An open-source, receive-only drone detector built from ESP32 boards, in Rust."
authors = ["The Rotorscope contributors"]
language = "en"
src = "docs"

[build]
build-dir = "target/book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
site-url = "/rotorscope/"
git-repository-url = "https://github.com/holdTheDoorHoid/rotorscope"
edit-url-template = "https://github.com/holdTheDoorHoid/rotorscope/edit/main/docs/{path}"
theme = "docs/assets/theme"
additional-css = ["docs/assets/rotorscope.css"]
additional-js = ["docs/assets/site.js", "docs/assets/mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
limit-results = 30
use-boolean-and = true
boost-title = 3
boost-hierarchy = 2
