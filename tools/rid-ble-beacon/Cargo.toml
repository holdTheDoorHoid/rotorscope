[package]
name = "rid-ble-beacon"
description = "Bench-only BT4 Remote ID test transmitter for a Linux laptop (BlueZ over D-Bus; obviously fake identity)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
# The same encoder the receivers decode with.
rid = { workspace = true, features = ["encode"] }
# firmware/rid-beacon/src/flight.rs (shared via #[path]) uses libm.
libm = "0.2"
# SIGINT/SIGTERM handling, so the advert is withdrawn cleanly.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
