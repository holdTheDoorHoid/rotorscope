[package]
name = "rid-view"
description = "Laptop tool: read a node's USB output and show live Remote ID tracks"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[features]
# `--ble ADAPTER`: scan with a laptop Bluetooth adapter through BlueZ over
# D-Bus (Linux; no root). zbus is pure Rust, so no libdbus is needed.
default = ["ble"]
ble = ["dep:zbus"]

[dependencies]
# Same merge/expiry/format code as the hub.
tracker.workspace = true
# The ADSBee's CSBee text (--adsbee); `encode` builds the --demo aircraft.
adsb = { workspace = true, features = ["encode"] }
link.workspace = true
# The demo classifies its Wi-Fi drone the way a node does.
wifidrone.workspace = true
# Open FPV link types (the node's "open" lines).
openlink = { workspace = true, features = ["serde"] }
# The phone page, for --http.
webui = { path = "../../crates/webui" }
heapless.workspace = true
# `encode` builds the --demo drones' messages exactly as a transmitter would.
rid = { workspace = true, features = ["serde", "encode"] }
serde.workspace = true
serde_json = "1"
# termios, to put a serial port in raw mode (no echo back into the node).
libc = "0.2"
zeromq = { version = "0.7", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", optional = true, default-features = false, features = ["blocking-api", "async-io"] }
