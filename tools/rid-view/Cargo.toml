[package]
name = "rid-view"
description = "Laptop tool: read a node's USB output and show live Remote ID tracks"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Same merge/expiry/format code as the hub.
tracker.workspace = true
link.workspace = true
# Open FPV link types (the node's "open" lines).
openlink = { workspace = true, features = ["serde"] }
# The phone page, for --http.
webui = { path = "../../crates/webui" }
heapless.workspace = true
# `encode` builds the --demo drones' messages exactly as a transmitter would.
rid = { workspace = true, features = ["serde", "encode"] }
serde.workspace = true
serde_json = "1"
# termios, to put a serial port in raw mode (no echo back into the node).
libc = "0.2"
