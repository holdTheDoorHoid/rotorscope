[package]
name = "airlink"
description = "Node-to-hub ESP-NOW packets: batches of link frames, beacons, version 3 per-node authentication, the keyless gateway relay"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# Per-node link keys (`LinkKey`, `NodeKey`) and their HMAC for the version 3
# packets (src/v3). No key is ever compiled in: boards read theirs from flash.
kitkeys = { path = "../kitkeys" }

[dev-dependencies]
link.workspace = true
heapless.workspace = true
fuzzkit = { path = "../fuzzkit" }
