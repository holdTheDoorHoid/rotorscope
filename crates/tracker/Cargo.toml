[package]
name = "tracker"
description = "Hub logic: merge detections into drone tracks, range/bearing, output formats"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rid = { workspace = true, features = ["serde"] }
link.workspace = true
ctrlwatch = { path = "../ctrlwatch", features = ["serde"] }
openlink = { workspace = true, features = ["serde"] }
adsb.workspace = true
wifidrone.workspace = true
# DJI product names and the radians-to-degrees factor (no_std, no default features).
droneid.workspace = true
heapless.workspace = true
serde.workspace = true
# Pure-Rust maths (sin/cos/atan2/sqrt) for range and bearing without std.
libm = "0.2"
# JSON lines for the phone page and USB stream, written into a caller buffer.
serde-json-core = { version = "0.6", default-features = false }
# DRIP (RFC 9575) signature checks on authentication messages, no_std.
remoteid = { version = "0.3.3", default-features = false, features = ["verify"] }

[dev-dependencies]
# Tests build realistic detections with the same encoder the test transmitter uses.
rid = { workspace = true, features = ["serde", "encode"] }
# Checks the no_std JSON output with a full parser.
serde_json = "1"
fuzzkit = { path = "../fuzzkit" }
