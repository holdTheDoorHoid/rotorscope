[package]
name = "djicrypt"
description = "DJI O4 DroneID decryption with an owner-supplied key: SM2 session-key unwrap, AES-128-CTR payloads (no_std, no alloc)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
droneid = { workspace = true }
sm2 = { version = "0.13", default-features = false, features = ["arithmetic"] }
sm3 = { version = "0.4", default-features = false }
sha2 = { version = "0.10", default-features = false }
aes = { version = "0.8", default-features = false }
ctr = { version = "0.9", default-features = false }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false }

[dev-dependencies]
fuzzkit = { path = "../fuzzkit" }
rand_core = { version = "0.6", features = ["getrandom"] }
