[package]
name = "coverage"
description = "Coverage coordinator: which node listens to what, from the hub's node table"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
link.workspace = true
ctrlwatch = { path = "../ctrlwatch" }
heapless.workspace = true

[dev-dependencies]
# Only for the test that `plans::ESPNOW_CHANNEL` is `airlink::GATEWAY_CHANNEL`
# (a normal dependency would pull airlink's key-baking build script into the
# hub firmware, which holds no link key).
airlink = { path = "../airlink" }
