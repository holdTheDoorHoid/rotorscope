[package]
name = "mavwatch"
description = "no_std detection of hostile MAVLink on a drone's telemetry link (ground-station exploit payloads, shell access, signing downgrade, injected and replayed frames), plus the MAVLink v1/v2 frame scanner ctrlwatch shares; receive-only"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# A MAVLink frame builder for tests (this crate's and ctrlwatch's). Nothing
# in firmware enables it.
encode = []

[dependencies]
heapless.workspace = true

[dev-dependencies]
mavwatch = { path = ".", features = ["encode"] }
