# Raw-radio capture on an ESP32-C5 (PLAN.md Phase 10b): the PHY driven by
# hand, the modem debug bus looped into PARL_IO as a continuous 40 MS/s ring,
# the dump engine's 10-bit snapshots, a minimal DroneID trigger/decoder loop
# and a dump-over-USB command. C5 only; build from c5/ with `cargo fw`
# (see README.md and BRINGUP.md). Receive-only: nothing here transmits.
[package]
name         = "node-sdr"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
license      = "GPL-3.0-or-later"
publish      = false

[[bin]]
name = "node-sdr"
path = "src/main.rs"
test = false
bench = false

# Firmware is its own workspace (different target from crates/*).
[workspace]

[features]
default = ["decode"]
# Build the DroneID receiver (~125 KiB) into the chip's PSRAM and decode
# every triggered burst. Needs a C5 with PSRAM (XIAO ESP32-C5 = C5HR8, 8 MB).
# Without it the node captures, triggers and dumps only, and fits a C5 with
# no PSRAM (C5HF4); see README.md "Memory".
decode = []
# Report to the hub over ESP-NOW (crates/airlink, docs/ESPNOW.md): between
# captures the node pauses, retunes to the gateway's 2.4 GHz channel 6,
# sends its queued link frames and listens briefly for a hub command, then
# re-locks the receiver. This is the ONLY way this firmware transmits; the
# capture path stays receive-only (see README.md "Hub link"). Off by default.
# Build with `cargo fw-now` from c5/.
espnow = ["esp-radio/esp-now", "dep:airlink"]
# Report on the wired bus (crates/wirebus, docs/WIREBUS.md): many nodes on one
# hub UART, polled by the hub; TX open-drain on XIAO D9 (GPIO9), RX on D7
# (GPIO12). Nothing is transmitted on the air and the capture never pauses
# to send. Build with `cargo fw-bus` from c5/. Not with `espnow`.
wirebus = ["dep:node-common", "node-common/wirebus"]

[dependencies]
rawcap  = { path = "../../crates/rawcap", default-features = false }
droneid = { path = "../../crates/droneid", default-features = false }
fpvscan = { path = "../../crates/fpvscan" }
djilink = { path = "../../crates/djilink" }
jamwatch = { path = "../../crates/jamwatch" }
link    = { path = "../../crates/link" }
airlink = { path = "../../crates/airlink", optional = true }
# The wired-bus node glue (feature `wirebus`), shared with node-wifi and node-ble.
node-common = { path = "../node-common", optional = true, features = ["esp32c5"] }
heapless = "0.8"

esp-hal                = { version = "~1.2.2", features = ["esp32c5", "unstable"] }
esp-rtos               = { version = "0.4.0", features = ["esp32c5", "embassy", "esp-alloc", "esp-radio"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c5"] }
esp-alloc              = { version = "0.11.0", features = ["esp32c5"] }
esp-backtrace          = { version = "0.20.0", features = ["esp32c5", "panic-handler", "println"] }
# USB-Serial-JTAG only, like node-wifi.
esp-println = { version = "0.18.0", default-features = false, features = ["esp32c5", "jtag-serial", "critical-section", "log-04"] }
# Same pin as node-wifi: beta.2 is yanked. Used only to start the Wi-Fi
# driver, which powers and calibrates the PHY; no frame is ever sent.
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32c5", "esp-alloc", "unstable", "wifi", "log-04"] }
# The blob bindings, and the libphy.a whose private entry points src/phy.rs
# calls. Pinned exactly: the PHY ABI below is checked against this blob only
# (build.rs verifies its SHA-256).
esp-wifi-sys-esp32c5 = { version = "=0.3.0" }

embassy-executor = { version = "0.10.0" }
embassy-time     = { version = "0.5.0" }
embassy-sync     = { version = "0.7" }
critical-section = "1.2.0"
log              = "0.4.27"

[build-dependencies]
sha2 = "0.10"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
# Speed over size: the per-sample loops (trigger probes, decimation) and the
# decoder run here. Flash is not the constraint on a 4/8 MB part.
opt-level     = 3
