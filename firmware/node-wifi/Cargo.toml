# Wi-Fi Remote ID listener. One source tree, two chips:
#   s3/  -> Node A, ESP32-S3, 2.4 GHz   (Xtensa, `esp` toolchain)
#   c5/  -> Node C, ESP32-C5, 5 GHz     (RISC-V, stable toolchain)
# Each chip directory holds only the toolchain pin and cargo config; build from
# inside it (see README.md). Exactly one chip feature must be enabled.
[package]
name         = "node-wifi"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
license      = "GPL-3.0-or-later"
publish      = false

[[bin]]
name = "node-wifi"
path = "src/main.rs"
test = false
bench = false

# Firmware is its own workspace (different targets/toolchains from crates/*).
[workspace]

[features]
esp32s3 = [
  "esp-hal/esp32s3",
  "esp-rtos/esp32s3",
  "esp-bootloader-esp-idf/esp32s3",
  "esp-alloc/esp32s3",
  "esp-backtrace/esp32s3",
  "esp-println/esp32s3",
  "esp-radio/esp32s3",
  "dep:esp-wifi-sys-esp32s3",
  "node-common/esp32s3",
]
esp32c5 = [
  "esp-hal/esp32c5",
  "esp-rtos/esp32c5",
  "esp-bootloader-esp-idf/esp32c5",
  "esp-alloc/esp32c5",
  "esp-backtrace/esp32c5",
  "esp-println/esp32c5",
  "esp-radio/esp32c5",
  "dep:esp-wifi-sys-esp32c5",
  "node-common/esp32c5",
]
# With esp32c5: boot as a 2.4 GHz node (channels 6/1/11, role Wifi24) instead
# of 5 GHz. Only the boot default: the hub's assignment picks the band at run
# time (and a job stored across an image switch wins over it).
band24 = []
# Send hub frames over ESP-NOW to a gateway (firmware/gateway) instead of the
# UART. Makes the node transmit; see docs/ESPNOW.md. 2.4 GHz builds only (the
# gateway is on 2.4 GHz channel 6). A 5 GHz plan gets 40 ms visits to channel 6
# at least once a second so the node can still send (`role::with_espnow_visits`).
espnow = ["esp-radio/esp-now", "dep:airlink", "node-common/espnow"]
# Report on the wired bus (crates/wirebus, docs/WIREBUS.md): many nodes on one
# hub UART, polled by the hub, TX open-drain on XIAO D9 (GPIO9), RX on D7
# (GPIO12). Receive-only on the air, like the plain wired build. C5 only; not
# with `espnow`.
wirebus = ["node-common/wirebus"]
# Bench only (docs/BENCH.md "Crash recovery"): type `fault panic` / `fault hang`
# on USB to prove the reboot after a panic and the hang watchdog. Never in a
# normal build.
faulttest = ["node-common/faulttest"]
# Bench only (docs/BENCH.md "Origin checks", docs/LINK-KEYS-DESIGN.md
# section 9): type `forge hubfix` (or csbee, flags, via, hello, threat, join)
# on USB to send a frame a node must never originate, and see the hub refuse
# it; with espnow also the captured-node attacks (`forge claim <mac>`, `cmd
# <mac>`, `beacon`, `hold <s>`, `spam <n>`, src/forge.rs). Not with faulttest
# (both read the USB console). Never in a normal build.
forgetest = []
# Bench only (docs/BENCH.md "Frame flood"): type `flood <kind> <rate>` on
# USB to push synthetic frames (random-address Remote ID, attack-tool and
# drone-maker beacons, DJI elements, wfb-ng links) into the node's own
# receive path, with or without one steady "real" drone. Transmits nothing.
# Not with faulttest or forgetest (all read the USB console). Never in a
# normal build.
floodtest = ["rid/encode", "openlink/build"]

[dependencies]
rid  = { path = "../../crates/rid", features = ["serde"] }
link = { path = "../../crates/link" }
airlink = { path = "../../crates/airlink", optional = true }
# Open FPV / telemetry link classifier (wfb-ng, OpenHD, RubyFPV, DroneBridge).
openlink = { path = "../../crates/openlink", features = ["serde"] }
# Built-in plans and the ESP-NOW channel-6 rule, shared with the hub's coordinator.
coverage = { path = "../../crates/coverage" }
# Which images this board holds; switching image for a role (OTA slots).
node-common = { path = "../node-common" }
nodeimage = { path = "../../crates/nodeimage" }
# Drone maker table (MAC prefixes, network names) for Frame::WifiDrone.
wifidrone = { path = "../../crates/wifidrone" }
# Attack detection (deauth / beacon floods, Karma, evil twins...) for Frame::Threat.
wifiwatch = { path = "../../crates/wifiwatch" }

esp-hal                = { version = "~1.2.2", features = ["unstable"] }
esp-rtos               = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio"] }
esp-bootloader-esp-idf = { version = "0.6.0" }
esp-alloc              = { version = "0.11.0" }
# custom-halt: reboot after a panic (`custom_halt` in main.rs).
esp-backtrace          = { version = "0.20.0", features = ["panic-handler", "println", "custom-halt"] }
# USB-Serial-JTAG only: "auto" could fall back to UART0, whose pins we give to the hub link.
esp-println = { version = "0.18.0", default-features = false, features = ["jtag-serial", "critical-section", "log-04"] }
# beta.2 was yanked (it only fixed ESP32-S31 builds); beta.1 is the newest usable release.
esp-radio = { version = "=1.0.0-beta.1", features = ["esp-alloc", "unstable", "wifi", "sniffer", "log-04"] }
# esp-radio keeps its blob bindings private; we need two calls it does not wrap
# (promiscuous filter, country code). Same version esp-radio links, so no duplicate.
esp-wifi-sys-esp32s3 = { version = "0.3.0", optional = true }
esp-wifi-sys-esp32c5 = { version = "0.3.0", optional = true }

embassy-executor = { version = "0.10.0" }
embassy-time     = { version = "0.5.0" }
embassy-sync     = { version = "0.7" }
# `yield_now` in the drain task (already in the build through embassy-executor).
embassy-futures  = "0.1"
# The async USB writer's `write_all` / `flush` (`usb.rs`; already in the
# build through esp-hal, which implements it for the USB-Serial-JTAG port).
embedded-io-async = "0.7"
critical-section = "1.2.0"
log              = "0.4.27"

serde           = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = { version = "0.6", default-features = false }
heapless        = { version = "0.9.4", features = ["serde"] }

[profile.dev]
# The default debug profile is too slow and too big for these chips.
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = "s"

# Patched esp-radio 1.0.0-beta.1, carried by every radio firmware (see
# ../patches/README.md): its ESP-NOW receive callback drops and counts a
# received length that is zero, negative or above the ESP-NOW v2 maximum
# (CVE-2025-52471 defence in depth), and on the ESP32-C5 it keeps the shared RF
# front-end clocks on while BLE is up. tools/check-wifi-blobs.sh checks both
# the patched copy and the radio library blobs.
[patch.crates-io]
esp-radio = { path = "../patches/esp-radio" }
