# Rotorscope hub on the Elecrow CrowPanel Advanced 5" (ESP32-P4, silicon v1.3).
#
# Bare-metal Rust on esp-hal, but NOT the crates.io esp-hal: upstream supports
# P4 silicon v3.0+ only. Every esp-* crate here is the pinned esp-hal commit
# plus the community pre-v3 patch, prepared by tools/p4-prepare.sh. Run that
# once before building. See README.md.
[package]
name         = "hub-p4"
version      = "0.1.0"
edition      = "2024"
license      = "GPL-3.0-or-later"
publish      = false

[[bin]]
name  = "hub-p4"
path  = "src/main.rs"
test  = false
bench = false

[workspace]

[features]
# Bring-up only: UART2 transmits sample link frames onto the gateway RX pin
# (GPIO28) inside the chip, so the UART3 reader is tested without any wire.
# Leave the UART3 header unconnected while this runs.
selftest = []
# Bench only: once a second, a made-up ESP-NOW node (02:52:53:00:00:01, a
# locally administered address no real board has) "reports" through the link
# decoder with Via + Hello + Status, so the coverage coordinator assigns it and
# the hub sends real commands to the gateway. Nothing is driven onto GPIO28,
# so the gateway wire can stay connected.
fakenode = []
# Bench only: once a second, a made-up drone (Remote ID Basic ID
# "RSTEST-SD-0001", from a made-up node 02:52:53:00:00:02) is decoded as if
# the gateway had relayed it, so the tracker has an active track and the SD
# log gets rows without a test transmitter. Nothing is driven onto any pin.
fakedrone = []
# Bench only: print the tracker's tables (a line per new drone slot, open-link
# stream, RF emitter and Wi-Fi drone; a summary every 5 s) and, at mount, count
# the previous SD log file's rows by kind. Test IDs only; see src/bench.rs.
benchlog = []

[dependencies]
link = { path = "../../crates/link" }
coverage = { path = "../../crates/coverage" }
rid = { path = "../../crates/rid" }
heapless = "0.8"
critical-section = "1.2"
screen = { path = "../../crates/screen", features = ["tracker"] }
tracker = { path = "../../crates/tracker" }
embedded-graphics = "0.8"
# SD card: our bit-banged native 1-bit protocol (crates/sdnative) under the
# same FAT driver the S3 hub uses. MIT/Apache.
sdnative = { path = "../../crates/sdnative" }
embedded-sdmmc = { version = "0.10", default-features = false }
esp-backtrace          = { path = "../patches/esp-hal-p4-pre-v3/upstream/esp-backtrace", features = ["esp32p4", "panic-handler", "println"] }
esp-bootloader-esp-idf = { path = "../patches/esp-hal-p4-pre-v3/upstream/esp-bootloader-esp-idf", features = ["esp32p4"] }
esp-hal                = { path = "../patches/esp-hal-p4-pre-v3/upstream/esp-hal", features = ["esp32p4", "unstable", "log-04"] }
esp-println            = { path = "../patches/esp-hal-p4-pre-v3/upstream/esp-println", features = ["esp32p4", "log-04"] }

[profile.release]
debug         = true
opt-level     = "s"
lto           = "fat"
codegen-units = 1
