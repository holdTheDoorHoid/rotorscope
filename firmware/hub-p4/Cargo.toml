# Rotorscope hub on the Elecrow CrowPanel Advanced 5" (ESP32-P4, silicon v1.3).
#
# Bare-metal Rust on esp-hal, but NOT the crates.io esp-hal: upstream supports
# P4 silicon v3.0+ only. Every esp-* crate here is the pinned esp-hal commit
# plus the community pre-v3 patch, prepared by tools/p4-prepare.sh. Run that
# once before building. See BRINGUP.md.
[package]
name         = "hub-p4"
version      = "0.1.0"
edition      = "2024"
license      = "GPL-3.0-or-later"
publish      = false

[[bin]]
name  = "hub-p4"
path  = "src/main.rs"
test  = false
bench = false

[workspace]

[features]
default = ["wirebus"]
# PLAN.md Phase 5a: poll many nodes on UART3 (the peripheral; on the board's
# UART1 header since 2026-11-17) as a wired bus (crates/wirebus,
# docs/WIREBUS.md, src/bus.rs). An ESP-NOW gateway (or one point-to-point
# node) on UART3 is still recognised at run time and read as before. Build
# with --no-default-features to never poll.
wirebus = []
# Bring-up only: UART2 transmits sample link frames onto the gateway RX pin
# (GPIO48) inside the chip, so the UART3 reader is tested without any wire.
# Leave the UART1 header unconnected while this runs.
selftest = []
# Bench only: once a second, a made-up ESP-NOW node (02:52:53:00:00:01, a
# locally administered address no real board has) "reports" through the link
# decoder with Via + Hello + Status, so the coverage coordinator assigns it and
# the hub sends real commands to the gateway. Nothing is driven onto GPIO48,
# so the gateway wire can stay connected.
fakenode = []
# Bench only: once a second, a made-up drone (Remote ID Basic ID
# "RSTEST-SD-0001", from a made-up node 02:52:53:00:00:02) is decoded as if
# the gateway had relayed it, so the tracker has an active track and the SD
# log gets rows without a test transmitter. Nothing is driven onto any pin.
fakedrone = ["rid/encode"]
# Bench only: print the tracker's tables (a line per new drone slot, open-link
# stream, RF emitter and Wi-Fi drone; a summary every 5 s) and, at mount, count
# the previous SD log file's rows by kind. Test IDs only; see src/bench.rs.
benchlog = []
# Show open FPV links' identifiers on every output (screen, console JSON, SD
# log). Off by default by project policy, exactly as the S3 hub's feature of
# the same name (see firmware/hub/Cargo.toml).
show-link-ids = []
# Bench only: on-chip loop-back test of the GPS and ADS-B inputs. UART2
# plays a Quectel LC29H(AA) on the GPS pads (GPIO28/27), the PPS pad
# (GPIO29) is pulsed from inside the chip, and UART4 sends CSBee lines onto
# its own RX pad (GPIO30). Leave the UART3-IN header, GPIO29 and GPIO30
# unconnected while it runs. Excludes `selftest` (both use UART2).
gpsloop = []
# As `gpsloop`, but UART2 plays a u-blox MAX-M10S as shipped (NMEA at 9600),
# so the baud hunt, MON-VER detection and UBX configuration are exercised.
gpsloop-m10 = ["gpsloop"]
# Bench only: on-chip loop-back test of the web-head feed (WEBHEAD.md).
# UART4's RX is moved from the ADSBee pad (GPIO30) to the web-head TX pad
# (GPIO31), where UART2 sends the feed, and the frames are decoded and
# counted. NMEA (a fixed test point) is injected into the GPS input and
# CSBee lines into the ADSBee input from inside the chip. The gateway wire
# stays connected and its traffic is forwarded as usual. Leave GPIO31 and
# GPIO30 unconnected while it runs.
webheadloop = []
# Bench only: build the airspace pack named by the AIRSPACE_PAK environment
# variable into the firmware and write it to the SD card as
# ROTORSCP/AIRSPACE.PAK when the card has none or a different one (then it
# is read back from the card like any pack). For loading a pack onto the
# card without taking the card out. See src/faa.rs.
embedpack = []
# Phase 14a: decode the ADSBee's raw Beast frames in-house (crates/modes)
# instead of trusting its CSBee summary. Set the ADSBee with
# `AT+PROTOCOL_OUT=COMMS_UART,BEAST`; CSBee lines are still accepted. Off by
# default until the raw path has run with a real ADSBee on this hub.
# (crates/modes itself is always built: aero nodes' 1090 frames use it.)
modes = []
# WP-13e bring-up (not a bench door: it only stops writes): read the kit
# records and the boot counter from flash, never write. The keyed link then
# stays closed (no new epoch). First step of the flash bring-up in
# src/linkauth.rs; a normal build writes one boot-counter entry per boot.
rskit-readonly = []
# Bench only: on-chip loop-back test of `modes`. UART4's TX drives its own
# RX pad (GPIO30) with Beast frames recorded from the owner's ADSBee on the
# laptop (2026-11-15, real aircraft), at their recorded pace, looped. Leave
# GPIO30 unconnected while it runs.
modesloop = ["modes"]
# Bench only (docs/BENCH.md "Crash recovery"): console line `fault panic` or
# `fault hang` (start with `f`, end with Enter) to prove the reboot after a
# panic and the hang watchdog. Never in a normal build (not in `default`).
faulttest = []
# Bench only: console `p` sets the hub's own position to a fixed test point
# (Philadelphia), for a bench with no GPS. Never in a normal build: in the
# field it would put every distance and flag in the wrong place.
testpoint = []
#
# Every feature above marked "Bench only" (and `selftest`) is fenced by
# build.rs: the build stops unless ROTORSCOPE_BENCH=1, and the hello line,
# the evidence boot event and the screen ("BENCH BUILD") say which are in.

[dependencies]
link = { path = "../../crates/link" }
# WP-13e: the keyed ESP-NOW link's hub side (kit records, boot counter,
# verifying and sealing; host-tested there), the v3 packets and the keys.
hublink = { path = "../../crates/hublink" }
airlink = { path = "../../crates/airlink" }
kitkeys = { path = "../../crates/kitkeys" }
# The wired bus master (Phase 5a).
wirebus = { path = "../../crates/wirebus" }
coverage = { path = "../../crates/coverage" }
rid = { path = "../../crates/rid" }
heapless = "0.9.4"
critical-section = "1.2"
# `wide`: the native 800x480 layout with anti-aliased lettering.
screen = { path = "../../crates/screen", features = ["tracker", "wide"] }
tracker = { path = "../../crates/tracker" }
ctrlwatch = { path = "../../crates/ctrlwatch" }
# Phase 12: airspace pack lookups and the possible-violation rule engine.
airspace = { path = "../../crates/airspace" }
faarules = { path = "../../crates/faarules" }
gnss = { path = "../../crates/gnss" }
# Phase 13: the evidence log (hash chain, signed checkpoints, software key).
evidence = { path = "../../crates/evidence", features = ["soft-signer", "decode"] }
# O4 DroneID decryption with the owner's key from the SD card (ROTORSCP/O4KEY.TXT).
djicrypt = { path = "../../crates/djicrypt" }
droneid = { path = "../../crates/droneid", default-features = false }
zeroize = { version = "1", default-features = false }
# `encode`: the web-head feed re-prints ADSBee reports as CSBee lines.
adsb = { path = "../../crates/adsb", features = ["encode"] }
# Phase 14a: our Mode S / ADS-B decoder. Feature `modes` decodes the
# ADSBee's Beast output with it; aero (LR2021) nodes' 1090 frames always do.
modes = { path = "../../crates/modes" }
# Aero nodes (docs/AERO-NODE.md): UAT 978, OGN, and FLARM legacy (keys
# from ROTORSCP/FLARMKEY.TXT, never in the firmware).
uat = { path = "../../crates/uat" }
flarm = { path = "../../crates/flarm", features = ["legacy"] }
embedded-graphics = "0.8"
# SD card: our bit-banged native 1-bit protocol (crates/sdnative) under the
# same FAT driver the S3 hub uses. MIT/Apache.
sdnative = { path = "../../crates/sdnative" }
embedded-sdmmc = { version = "0.10", default-features = false }
# custom-halt: reboot after a panic (`custom_halt` in main.rs, `fault.rs`).
esp-backtrace          = { path = "../patches/esp-hal-p4-pre-v3/upstream/esp-backtrace", features = ["esp32p4", "panic-handler", "println", "custom-halt"] }
esp-bootloader-esp-idf = { path = "../patches/esp-hal-p4-pre-v3/upstream/esp-bootloader-esp-idf", features = ["esp32p4"] }
esp-hal                = { path = "../patches/esp-hal-p4-pre-v3/upstream/esp-hal", features = ["esp32p4", "unstable", "log-04"] }
esp-println            = { path = "../patches/esp-hal-p4-pre-v3/upstream/esp-println", features = ["esp32p4", "log-04"] }

[profile.release]
debug         = true
opt-level     = "s"
lto           = "fat"
codegen-units = 1
