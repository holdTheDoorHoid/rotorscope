# Rotorscope hub. One source tree, two chips (like the nodes):
#   s3/  -> ESP32-S3 (Xtensa, `esp` toolchain). The real hub.
#   c5/  -> ESP32-C5 (RISC-V, stable). Kept compiling so the hub can move to a
#           C5 if that ever makes sense; it has only two HP UARTs (see pins.rs).
# Each chip directory holds only the toolchain pin and cargo config; build from
# inside it with `cargo fw` (see README.md). Exactly one chip feature.
[package]
name         = "hub"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
license      = "GPL-3.0-or-later"
publish      = false

[[bin]]
name = "hub"
path = "src/main.rs"
test = false
bench = false

# Firmware is its own workspace (different targets/toolchains from crates/*).
[workspace]

[features]
esp32s3 = [
  "esp-hal/esp32s3",
  "esp-rtos/esp32s3",
  "esp-bootloader-esp-idf/esp32s3",
  "esp-alloc/esp32s3",
  "esp-backtrace/esp32s3",
  "esp-println/esp32s3",
  "esp-radio/esp32s3",
  "dep:esp-wifi-sys-esp32s3",
]
esp32c5 = [
  "esp-hal/esp32c5",
  "esp-rtos/esp32c5",
  "esp-bootloader-esp-idf/esp32c5",
  "esp-alloc/esp32c5",
  "esp-backtrace/esp32c5",
  "esp-println/esp32c5",
  "esp-radio/esp32c5",
  "dep:esp-wifi-sys-esp32c5",
]
# Two synthetic, obviously fake drones circling the hub, injected as if a
# node had heard them. Exercises every output without any radio nodes.
demo = ["rid/encode", "adsb/encode"]
# Build the hotspot without a password. For bench tests only: anyone nearby
# could then join and read the track list.
open-hotspot = []
# Screen controller. The default is an ST7789 (2.0" 320x240 class); this
# feature selects an ILI9341 (2.8" class) instead. The panel is not chosen yet.
ili9341 = []
# Read the GPS over a UART instead of I2C. Costs node link 2 (the S3 has only
# three UARTs): the GPS takes UART2 on the GPS pins (see pins.rs).
gps-uart = []
# Show open FPV links' identifiers (wfb-ng link ID, RubyFPV vehicle ID,
# DroneBridge comm ID) and those links' transmitter addresses on every output
# (phone page, USB, SD log). Off by default, by project policy: recognising
# that an FPV link is on the air is shown to anyone, but the identifiers
# single out someone's equipment, so whoever builds the unit must opt in.
show-link-ids = []
# ADS-B: read an ADSBee 1090's CSBee output on UART2 (pin `adsbee_rx`, see
# pins.rs) and show crewed aircraft beside the drones (src/adsbee.rs). S3
# only, and it costs node link 2 (the 5 GHz node): the S3 has three UARTs.
# Excludes `gps-uart`, which wants the same UART.
adsbee = []
# Web head for the P4 hub (firmware/hub-p4/WEBHEAD.md): this board serves the
# hotspot, phone page, CoT and station mode, fed by the P4 over node link 0
# (one wire to the RX pin of node A). The frames (relayed nodes, GPS, UTC,
# ADS-B) are understood by every build; this feature only adds the aircraft
# table for the P4's forwarded ADS-B (an `adsbee` build has it anyway).
webhead = []

[dependencies]
rid     = { path = "../../crates/rid", features = ["serde"] }
link    = { path = "../../crates/link" }
# Open FPV link types (the demo builds sightings with them).
openlink = { path = "../../crates/openlink", features = ["serde"] }
tracker = { path = "../../crates/tracker" }
# CSBee parser for the ADSBee (feature `adsbee`; the types are used regardless).
adsb    = { path = "../../crates/adsb" }
# The phone page, gzipped at build time (web/index.html).
webui   = { path = "../../crates/webui" }
# MAX-M10S parser and configuration frames (no I/O of its own).
gnss    = { path = "../../crates/gnss" }
# On-device screen: view-model, button state machine, banded renderer.
screen  = { path = "../../crates/screen", features = ["tracker"] }
# Words for the P4's possible-violation flags (web head; PLAN.md Phase 12).
faarules = { path = "../../crates/faarules" }

esp-hal                = { version = "~1.2.2", features = ["unstable"] }
esp-rtos               = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio"] }
esp-bootloader-esp-idf = { version = "0.6.0" }
esp-alloc              = { version = "0.11.0" }
# custom-halt: reboot after a panic (see `custom_halt` in main.rs).
esp-backtrace = { version = "0.20.0", default-features = false, features = ["panic-handler", "println", "custom-halt"] }
# Only the panic handler and the boot banner print directly; everything else
# goes through the async USB-Serial-JTAG driver (usb.rs). `jtag-serial` keeps
# the panic text on the same USB port, never on UART0 (whose pins we reuse).
esp-println = { version = "0.18.0", default-features = false, features = ["jtag-serial", "critical-section"] }
# beta.2 was yanked (it only fixed ESP32-S31 builds); beta.1 is the newest usable release.
esp-radio = { version = "=1.0.0-beta.1", features = ["esp-alloc", "unstable", "wifi"] }
# esp-radio keeps its blob bindings private; the country code call is not
# wrapped (same reason as the nodes). Same version esp-radio links.
esp-wifi-sys-esp32s3 = { version = "0.3.0", optional = true }
esp-wifi-sys-esp32c5 = { version = "0.3.0", optional = true }

embassy-executor = { version = "0.10.0" }
embassy-time     = { version = "0.5.0" }
embassy-sync     = { version = "0.7" }
embassy-futures  = "0.1"
embassy-net = { version = "0.9", features = ["tcp", "udp", "proto-ipv4", "medium-ethernet", "dhcpv4", "multicast"] }
embedded-io-async = "0.7"

# HTTP server: async, no_std, no alloc, on embassy-net. MIT/Apache.
picoserve = { version = "0.20", default-features = false, features = ["embassy"] }
# DHCP server and captive-portal DNS on embassy-net sockets. MIT/Apache.
edge-dhcp        = { version = "0.8", default-features = false, features = ["io"] }
edge-captive     = { version = "0.8", default-features = false, features = ["io"] }
edge-nal         = "0.7"
edge-nal-embassy = { version = "0.9", default-features = false, features = ["proto-ipv4", "medium-ethernet", "udp", "tcp"] }

# Screen and SD card share one SPI bus (separate chip selects). All three
# are MIT/Apache. mipidsi drives ST7789/ILI9341 over embedded-hal 1.0;
# embedded-sdmmc is a FAT driver for SD cards in SPI mode; embedded-hal-bus
# shares the bus between the two devices.
embedded-hal        = "1.0"
embedded-hal-bus    = "0.3"
embedded-graphics   = "0.8"
mipidsi             = { version = "0.10", default-features = false }
embedded-sdmmc      = { version = "0.10", default-features = false }

# esp-hal's one-shot ADC read is an `nb` call.
nb               = "1"
critical-section = "1.2.0"
static_cell      = "2.1.1"
heapless         = { version = "0.8", features = ["serde"] }
serde            = { version = "1", default-features = false, features = ["derive"] }
serde-json-core  = { version = "0.6", default-features = false }
libm             = "0.2"

[build-dependencies]
# Parses the owner's optional, gitignored wifi.local.toml (station mode).
toml = { version = "0.8", default-features = false, features = ["parse"] }
serde = { version = "1", features = ["derive"] }

[profile.dev]
# The default debug profile is too slow and too big for these chips.
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = "s"

# Patched esp-radio 1.0.0-beta.1, carried by every radio firmware (see
# ../patches/README.md): its ESP-NOW receive callback drops and counts a
# received length that is zero, negative or above the ESP-NOW v2 maximum
# (CVE-2025-52471 defence in depth), and on the ESP32-C5 it keeps the shared RF
# front-end clocks on while BLE is up. tools/check-wifi-blobs.sh checks both
# the patched copy and the radio library blobs.
[patch.crates-io]
esp-radio = { path = "../patches/esp-radio" }
