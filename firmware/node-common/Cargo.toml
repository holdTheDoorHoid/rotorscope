# Flash glue shared by the node images (node-wifi, node-ble): which images
# this board holds (so the node can report its `can` mask), and switching to
# another image with a job that survives the reboot. The pure logic is
# crates/nodeimage (host-tested); this is the part that touches flash.
# Also `fault`: reboot after a panic, the hang watchdog and the reset
# reason, for the nodes and the gateway (docs/BENCH.md "Crash recovery").
# A library used by path from each firmware; it builds inside that firmware's
# workspace, for that firmware's chip.
[package]
name         = "node-common"
version      = "0.1.0"
edition      = "2024"
license      = "GPL-3.0-or-later"
publish      = false

[lib]
test = false
bench = false

[features]
esp32s3 = ["esp-hal/esp32s3", "esp-bootloader-esp-idf/esp32s3"]
esp32c5 = ["esp-hal/esp32c5", "esp-bootloader-esp-idf/esp32c5"]
# The aero node (firmware/node-lr) on an ESP32-C3: wired bus only (it holds a
# single image, so `Images` is not used there).
esp32c3 = ["esp-hal/esp32c3", "esp-bootloader-esp-idf/esp32c3"]
# The wired-bus node (crates/wirebus, docs/WIREBUS.md): many nodes on one hub
# UART, polled by the hub. `src/bus.rs`; used by node-wifi, node-ble,
# node-sdr and node-lr when they are built with their own `wirebus` feature.
wirebus = ["dep:wirebus", "dep:embassy-time", "dep:critical-section", "dep:portable-atomic"]
# The ESP-NOW link (docs/LINK-KEYS-DESIGN.md, package 13g): `keystore` (the
# rskey provisioning record at boot) and `linkauth` (the link glue every
# ESP-NOW image shares; the logic is nodeimage::uplink, host-tested). Turned
# on by each image's own `espnow` feature; wired and bus builds never build
# airlink.
espnow = ["nodeimage/uplink", "dep:airlink", "dep:kitkeys", "dep:critical-section"]
# Bench only (docs/BENCH.md "Crash recovery"): `fault::console`, typed
# `fault panic` / `fault hang` on USB to prove the reboot and the watchdog.
# Enabled only through a firmware's own `faulttest` feature, which is in no
# `default` list.
faulttest = ["dep:embassy-time"]

[dependencies]
link      = { path = "../../crates/link" }
nodeimage = { path = "../../crates/nodeimage" }
airlink   = { path = "../../crates/airlink", optional = true }
kitkeys   = { path = "../../crates/kitkeys", optional = true }
esp-hal                = { version = "~1.2.2", features = ["unstable"] }
esp-bootloader-esp-idf = { version = "0.6.0" }
heapless = { version = "0.8", features = ["serde"] }
wirebus  = { path = "../../crates/wirebus", optional = true }
embassy-time     = { version = "0.5.0", optional = true }
critical-section = { version = "1.2.0", optional = true }
portable-atomic  = { version = "1", default-features = false, optional = true }
