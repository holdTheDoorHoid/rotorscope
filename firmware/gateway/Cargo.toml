# ESP-NOW gateway: one XIAO ESP32-C5 that receives every ESP-NOW node and
# relays their packets, still sealed, to the hub over one UART (`link::gw`,
# protocol 14), and transmits what the hub sealed. It holds no key. See
# docs/LINK-KEYS-DESIGN.md. Build here with `cargo fw`.
[package]
name         = "gateway"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
license      = "GPL-3.0-or-later"
publish      = false

[[bin]]
name  = "gateway"
path  = "src/main.rs"
test  = false
bench = false

[workspace]

[features]
# Bench only (docs/BENCH.md "Crash recovery"): type `fault panic` / `fault hang`
# on USB to prove the reboot after a panic and the hang watchdog. Never in a
# normal build.
faulttest = ["node-common/faulttest"]
# Bench only (docs/LINK-KEYS-DESIGN.md section 9): `gwforge ...` typed on USB
# makes this gateway behave as a captured one (made-up and replayed packets
# to the hub, a flipped byte, a held time sync, dropped packets). Fenced by
# build.rs like every bench feature. Not with `faulttest` (one USB console).
gwforge = []

[dependencies]
link    = { path = "../../crates/link" }
airlink = { path = "../../crates/airlink" }
# Crash recovery (`node_common::fault`): watchdog, reboot after a panic, reset reason.
node-common = { path = "../node-common", features = ["esp32c5"] }

esp-hal                = { version = "~1.2.2", features = ["unstable", "esp32c5"] }
esp-rtos               = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32c5"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c5"] }
esp-alloc              = { version = "0.11.0", features = ["esp32c5"] }
# custom-halt: reboot after a panic (`custom_halt` in main.rs).
esp-backtrace          = { version = "0.20.0", features = ["panic-handler", "println", "esp32c5", "custom-halt"] }
esp-println = { version = "0.18.0", default-features = false, features = ["jtag-serial", "critical-section", "log-04", "esp32c5"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp-alloc", "unstable", "wifi", "esp-now", "log-04", "esp32c5"] }
esp-wifi-sys-esp32c5 = { version = "0.3.0" }

embassy-executor = { version = "0.10.0" }
embassy-time     = { version = "0.5.0" }
embassy-sync     = { version = "0.7" }
critical-section = "1.2.0"
# The async USB writer (src/usb.rs); already in the lockfile through esp-hal.
embedded-io-async = "0.7"
log              = "0.4.27"
heapless         = { version = "0.9.4" }

[profile.dev]
opt-level = "s"

[profile.release]
debug         = true
opt-level     = "s"
lto           = "fat"
codegen-units = 1

# Patched esp-radio 1.0.0-beta.1, carried by every radio firmware (see
# ../patches/README.md): its ESP-NOW receive callback drops and counts a
# received length that is zero, negative or above the ESP-NOW v2 maximum
# (CVE-2025-52471 defence in depth), and on the ESP32-C5 it keeps the shared RF
# front-end clocks on while BLE is up. tools/check-wifi-blobs.sh checks both
# the patched copy and the radio library blobs.
[patch.crates-io]
esp-radio = { path = "../patches/esp-radio" }
